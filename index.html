<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ufficio virtuale</title>
<style>
  :root {
    --bg: #1b1d24; --card: #252833; --line: #343846; --text: #e8e9ee; --muted: #9a9fb0;
    --aspetta: #ff5d5d; --lavora: #4cc38a; --pensa: #5aa9f0; --ferma: #f2b14a; --finito: #8b90a3; --inattiva: #5d6272;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .conta { color: var(--muted); }
  .live { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--inattiva); }
  .live.on::before { background: var(--lavora); }
  label { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
         gap: 14px; padding: 18px 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c);
          border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
          cursor: pointer; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--c); transform: translateY(-1px); }
  .top { display: flex; align-items: center; gap: 8px; }
  .stato { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
           color: var(--c); }
  .card.lavora .stato::before, .card.pensa .stato::before { content: "● "; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .quando { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .titolo { font-weight: 600; overflow-wrap: anywhere; }
  .attivita { color: var(--text); font-size: 14px; display: flex; gap: 8px; align-items: baseline;
              overflow-wrap: anywhere; }
  .icona { font-size: 16px; }
  .dettaglio { color: var(--muted); font-family: Consolas, monospace; font-size: 12px; overflow-wrap: anywhere;
               padding-left: 26px; }
  .lavoro { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--text); }
  .lavoro .commessa { background: #3a3220; color: #f2c66d; border-radius: 4px; padding: 0 6px; font-weight: 600; }
  .lavoro .link { color: #8fb8ff; text-decoration: none; margin-left: auto; }
  .lavoro .link:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .lavora { --c: var(--lavora); } .pensa { --c: var(--pensa); } .ferma { --c: var(--ferma); }
  .aspetta { --c: var(--aspetta); } .card.aspetta { box-shadow: 0 0 0 1px var(--aspetta), 0 0 14px rgba(255,93,93,.25); }
  .card.aspetta .stato::before { content: "✋ "; }
  .finito { --c: var(--finito); } .inattiva, .vuota, .sconosciuto { --c: var(--inattiva); }
  .card.inattiva, .card.vuota { opacity: .65; }
  .vuoto { color: var(--muted); padding: 40px 20px; }
  #ufficio { position: relative; padding: 16px 20px 0; display: flex; justify-content: center; }
  #ufficio canvas { image-rendering: pixelated; display: block; border-radius: 6px;
                    box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  #ufficio .strato { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); }
  .posto { position: absolute; cursor: pointer; border-radius: 6px; }
  .posto:hover { outline: 2px solid rgba(255,255,255,.35); }
  .posto.assente { opacity: .9; }
  .fumetto { position: absolute; left: 50%; bottom: 82%; transform: translateX(-50%);
             max-width: 120%; width: max-content; background: #fffdf5; color: #222;
             font: 600 12px/1.25 "Segoe UI", system-ui, sans-serif; padding: 4px 8px; border-radius: 8px;
             border: 2px solid #222; box-shadow: 2px 2px 0 rgba(0,0,0,.35); text-align: center; z-index: 2; }
  .fumetto::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -5px;
                    border: 5px solid transparent; border-top-color: #222; }
  .fumetto.pop { animation: pop .35s cubic-bezier(.3,1.6,.6,1); }
  @keyframes pop { from { transform: translateX(-50%) scale(.3); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  .fumetto.st-ferma { background: #fff1d6; animation: dondola 2.4s ease-in-out infinite; }
  @keyframes dondola { 50% { transform: translateX(-50%) translateY(-3px); } }
  .fumetto.st-finito { background: #e9ecf2; color: #555; }
  .fumetto.st-pensa { background: #e4f1ff; }
  .fumetto.st-aspetta { background: #ffe1e1; border-color: #c62828; color: #7a1010;
                        animation: chiama 1.2s ease-in-out infinite; z-index: 3;
                        white-space: normal; width: 96%; max-width: none; font-size: 11.5px;
                        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fumetto.st-aspetta::after { border-top-color: #c62828; }
  @keyframes chiama { 50% { transform: translateX(-50%) scale(1.06); box-shadow: 0 0 12px 2px rgba(255,80,80,.7); } }
  .cartello { position: absolute; display: flex; gap: 8px; align-items: center; z-index: 4;
              font: 700 12px/1.2 "Segoe UI", system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #000;
              white-space: nowrap; overflow: hidden; padding: 0 6px; }
  .cartello .pallino { width: 9px; height: 9px; border-radius: 2px; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .cartello.ufficio { justify-content: center; font-size: 11.5px; }
  .cartello a { color: #b9d3ff; font-weight: 600; text-decoration: none; }
  .cartello a:hover { text-decoration: underline; }
  .cartello button { background: none; border: 0; cursor: pointer; font-size: 12px; padding: 0; opacity: .7; }
  .cartello button:hover { opacity: 1; }
  .fumetto.st-allarme { background: #ff2b2b; color: #fff; border-color: #700; animation: chiama .6s infinite; }
  .tia { font-size: 12.5px; padding: 2px 8px; border-radius: 10px; background: #2b2f3b; color: var(--text); }
  .tia.troppi { background: #5a1f1f; color: #ffb3b3; }
  .riepilogo { white-space: pre-line; position: absolute; text-align: center; z-index: 4; pointer-events: auto;
               font: 700 11.5px/1.2 "Segoe UI", system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #000; }
  .riepilogo.chiama { color: #ffb3b3; }
  .targa { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; color: #fff;
           font: 600 10.5px/1.2 "Segoe UI", system-ui, sans-serif; text-shadow: 0 1px 2px #000, 0 0 3px #000;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .ufficio-vuoto { position: absolute; left: 0; right: 0; bottom: 30%; text-align: center; color: #fff;
                   text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<header>
  <h1>Ufficio virtuale</h1>
  <span class="conta" id="conta"></span>
  <span class="tia" id="tia" title="Stima dalle sessioni delle ultime 2 ore: TIA aperti e non ancora chiusi. Regola: massimo 2 per versione e 3 in totale."></span>
  <label><input type="checkbox" id="soloAttive"> solo attive</label>
  <span class="live" id="live">non collegato</span>
  <span class="conta" id="versione" style="font-size:12px">server: versione vecchia</span>
</header>
<section id="ufficio"></section>
<main id="lista"><div class="vuoto">Carico le sessioni…</div></main>

<script src="/ufficio.js"></script>
<script>
const STATI = {
  "aspetta": ["aspetta", "aspetta te"],
  "lavora": ["lavora", "lavora"],
  "pensa": ["pensa", "pensa"],
  "ferma?": ["ferma", "ferma da un po'"],
  "finito": ["finito", "ha finito"],
  "inattiva": ["inattiva", "inattiva"],
  "vuota": ["vuota", "vuota"],
};
let sessioni = [];
const lista = document.getElementById("lista");
const soloAttive = document.getElementById("soloAttive");
try { soloAttive.checked = localStorage.getItem("soloAttive") === "1"; } catch (e) {}
soloAttive.onchange = () => {
  try { localStorage.setItem("soloAttive", soloAttive.checked ? "1" : "0"); } catch (e) {}
  render();
};

function fa(ts) {
  if (!ts) return "-";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return s + " s fa";
  if (s < 3600) return Math.floor(s / 60) + " min fa";
  return Math.floor(s / 3600) + " h " + Math.floor(s % 3600 / 60) + " min fa";
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function render() {
  const attive = ["aspetta", "lavora", "pensa", "ferma?"];
  // chi aspetta te viene sempre per primo
  sessioni = [...sessioni].sort((a, b) => (b.stato === "aspetta") - (a.stato === "aspetta"));
  const nAspetta = sessioni.filter(s => s.stato === "aspetta").length;
  // TIA aperti (stima): sessioni delle ultime 2 ore con un TIA aperto e non chiuso
  const recenti = sessioni.filter(s => s.tia && Date.now() / 1000 - s.modificato < 7200);
  const perVer = {};
  for (const s of recenti) perVer[s.tia.versione || "?"] = (perVer[s.tia.versione || "?"] || 0) + 1;
  const tiaEl = document.getElementById("tia");
  tiaEl.textContent = "TIA aperti: " + recenti.length + "/3" +
    Object.entries(perVer).sort().map(([v, n]) => " · " + v + ": " + n).join("");
  tiaEl.classList.toggle("troppi", recenti.length > 3 || Object.values(perVer).some(n => n > 2));
  document.title = (nAspetta ? `(${nAspetta}) ✋ ` : "") + "Ufficio virtuale";
  const vis = soloAttive.checked ? sessioni.filter(s => attive.includes(s.stato)) : sessioni;
  const nAttive = sessioni.filter(s => attive.includes(s.stato)).length;
  document.getElementById("conta").textContent =
    `${sessioni.length} sessioni, ${nAttive} al lavoro` + (nAspetta ? ` · ✋ ${nAspetta} ti aspett${nAspetta > 1 ? "ano" : "a"}` : "");
  lista.replaceChildren();
  if (!vis.length) {
    lista.append(el("div", "vuoto", soloAttive.checked ? "Nessun agente al lavoro adesso." : "Nessuna sessione recente."));
    return;
  }
  for (const s of vis) {
    const [cls, etichetta] = STATI[s.stato] || ["sconosciuto", s.stato];
    const card = el("article", "card " + cls);
    card.title = "Apri la chat completa";
    card.onclick = () => window.open("/chat?id=" + encodeURIComponent(s.id), "chat-" + s.id);
    const top = el("div", "top");
    top.append(el("span", "stato", etichetta));
    const q = el("span", "quando", fa(s.modificato));
    q.dataset.ts = s.modificato;
    top.append(q);
    card.append(top, el("div", "titolo", s.titolo || "(senza titolo)"));
    const lavoro = el("div", "lavoro");
    if (s.commessa) lavoro.append(el("span", "commessa", "📌 " + s.commessa));
    if (s.progetto_tia) lavoro.append(el("span", "", "🧩 " + s.progetto_tia + (s.tia && s.tia.versione ? " · " + s.tia.versione : "")));
    if (s.compilazione) lavoro.append(el("span", "", s.compilazione.errori === 0 ? "✅ compila"
      : "❌ " + (s.compilazione.errori > 0 ? s.compilazione.errori + " errori" : "errori")));
    if (s.plcsim) lavoro.append(el("span", "", "🧪 PLCSIM attivo"));
    if (s.download) lavoro.append(el("span", "commessa", "🚨 download sul PLC!"));
    if (s.progetto_claude) lavoro.append(el("span", "", "🗂️ " + s.progetto_claude));
    if (s.link) {
      const a = el("a", "link", "apri su claude.ai ↗");
      a.href = s.link; a.target = "_blank"; a.rel = "noopener";
      a.title = "Apre la chat nel progetto claude.ai";
      a.onclick = ev => ev.stopPropagation();
      lavoro.append(a);
    }
    if (lavoro.childNodes.length) card.append(lavoro);
    if (s.attivita) {
      const a = el("div", "attivita");
      a.append(el("span", "icona", s.icona || ""), el("span", "", s.attivita));
      card.append(a);
    }
    if (s.dettaglio) card.append(el("div", "dettaglio", s.dettaglio));
    const meta = el("div", "meta");
    meta.append(el("span", "", "📁 " + s.progetto));
    if (s.ultimo_strumento && s.stato !== "lavora")
      meta.append(el("span", "", "ultima azione: " + s.ultimo_strumento));
    if (s.sotto_agenti) meta.append(el("span", "", "👥 " + s.sotto_agenti + " sotto-agenti"));
    meta.append(el("span", "", s.id.slice(0, 8)));
    card.append(meta);
    lista.append(card);
  }
}

// aggiorna i "x min fa" senza ridisegnare tutto
setInterval(() => {
  for (const q of document.querySelectorAll(".quando")) q.textContent = fa(+q.dataset.ts);
}, 1000);

function collega() {
  const live = document.getElementById("live");
  const es = new EventSource("/api/stream");
  es.addEventListener("sessioni", ev => {
    sessioni = JSON.parse(ev.data);
    render();
    if (window.Ufficio) Ufficio.disegna(sessioni);
  });
  es.onopen = () => { live.textContent = "live"; live.classList.add("on"); };
  es.onerror = () => { live.textContent = "server non raggiungibile, riprovo…"; live.classList.remove("on"); };
}
collega();
fetch("/api/versione").then(r => r.ok ? r.json() : null).then(v => {
  if (v) document.getElementById("versione").textContent = "versione: " + v.versione + (v.git ? " · " + v.git : "");
}).catch(() => {});
// se il server si aggiorna, ricarico la pagina con la versione nuova
let versioneIniziale = null;
async function controllaVersione() {
  try {
    const v = await (await fetch("/api/versione", { cache: "no-store" })).json();
    const id = v.versione + "/" + (v.git || "");
    if (versioneIniziale === null) versioneIniziale = id;
    else if (id !== versioneIniziale) location.reload();
  } catch (e) {}
}
controllaVersione();
setInterval(controllaVersione, 20000);
</script>
</body>
</html>
