<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ufficio virtuale</title>
<style>
  :root {
    --bg: #1b1d24; --card: #252833; --line: #343846; --text: #e8e9ee; --muted: #9a9fb0;
    --aspetta: #ff5d5d; --lavora: #4cc38a; --pensa: #5aa9f0; --ferma: #f2b14a; --finito: #8b90a3; --inattiva: #5d6272;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .conta { color: var(--muted); }
  .live { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--inattiva); }
  .live.on::before { background: var(--lavora); }
  label { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
         gap: 14px; padding: 18px 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c);
          border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
          cursor: pointer; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--c); transform: translateY(-1px); }
  .top { display: flex; align-items: center; gap: 8px; }
  .stato { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
           color: var(--c); }
  .card.lavora .stato::before, .card.pensa .stato::before { content: "● "; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .quando { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .titolo { font-weight: 600; overflow-wrap: anywhere; }
  .sottotitolo { color: var(--muted); font-size: 12px; margin-top: -2px; overflow-wrap: anywhere; }
  .resp { font-size: 12px; color: var(--muted); }
  .grigio { color: var(--muted); }
  .attivita { color: var(--text); font-size: 14px; display: flex; gap: 8px; align-items: baseline;
              overflow-wrap: anywhere; }
  .icona { font-size: 16px; }
  .dettaglio { color: var(--muted); font-family: Consolas, monospace; font-size: 12px; overflow-wrap: anywhere;
               padding-left: 26px; }
  .lavoro { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--text); }
  .lavoro .commessa { background: #3a3220; color: #f2c66d; border-radius: 4px; padding: 0 6px; font-weight: 600; }
  .lavoro .link { color: #8fb8ff; text-decoration: none; margin-left: auto; }
  .lavoro .link:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .lavora { --c: var(--lavora); } .pensa { --c: var(--pensa); } .ferma { --c: var(--ferma); }
  .aspetta { --c: var(--aspetta); } .card.aspetta { box-shadow: 0 0 0 1px var(--aspetta), 0 0 14px rgba(255,93,93,.25); }
  .card.aspetta .stato::before { content: "✋ "; }
  .finito { --c: var(--finito); } .inattiva, .vuota, .sconosciuto { --c: var(--inattiva); }
  .card.inattiva, .card.vuota { opacity: .65; }
  .vuoto { color: var(--muted); padding: 40px 20px; }
  #ufficio { position: relative; padding: 16px 20px 0; display: flex; justify-content: center; }
  #ufficio canvas { image-rendering: pixelated; display: block; border-radius: 6px;
                    box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  #ufficio .strato { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); }
  .posto { position: absolute; cursor: pointer; border-radius: 6px; }
  .posto:hover { outline: 2px solid rgba(255,255,255,.35); }
  .posto.assente { opacity: .9; }
  .fumetto { position: absolute; left: 50%; bottom: 82%; transform: translateX(-50%);
             max-width: 120%; width: max-content; background: #fffdf5; color: #222;
             font: 600 12px/1.25 "Segoe UI", system-ui, sans-serif; padding: 4px 8px; border-radius: 8px;
             border: 2px solid #222; box-shadow: 2px 2px 0 rgba(0,0,0,.35); text-align: center; z-index: 2; }
  .fumetto::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -5px;
                    border: 5px solid transparent; border-top-color: #222; }
  .fumetto.pop { animation: pop .35s cubic-bezier(.3,1.6,.6,1); }
  @keyframes pop { from { transform: translateX(-50%) scale(.3); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  .fumetto.st-ferma { background: #fff1d6; animation: dondola 2.4s ease-in-out infinite; }
  @keyframes dondola { 50% { transform: translateX(-50%) translateY(-3px); } }
  .fumetto.st-finito { background: #e9ecf2; color: #555; }
  .fumetto.st-pensa { background: #e4f1ff; }
  .fumetto.st-aspetta { background: #ffe1e1; border-color: #c62828; color: #7a1010;
                        animation: chiama 1.2s ease-in-out infinite; z-index: 3;
                        white-space: normal; width: 96%; max-width: none; font-size: 11.5px;
                        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fumetto.st-aspetta::after { border-top-color: #c62828; }
  @keyframes chiama { 50% { transform: translateX(-50%) scale(1.06); box-shadow: 0 0 12px 2px rgba(255,80,80,.7); } }
  .cartello { position: absolute; display: flex; gap: 8px; align-items: center; z-index: 4;
              font: 700 12px/1.2 "Segoe UI", system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #000;
              white-space: nowrap; overflow: hidden; padding: 0 6px; }
  .cartello .pallino { width: 9px; height: 9px; border-radius: 2px; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .cartello.ufficio { justify-content: center; font-size: 11.5px; }
  .cartello a { color: #b9d3ff; font-weight: 600; text-decoration: none; }
  .cartello a:hover { text-decoration: underline; }
  .cartello button { background: none; border: 0; cursor: pointer; font-size: 12px; padding: 0; opacity: .7; }
  .cartello button:hover { opacity: 1; }
  .fumetto.st-allarme { background: #ff2b2b; color: #fff; border-color: #700; animation: chiama .6s infinite; }
  .tia { font-size: 12.5px; padding: 2px 8px; border-radius: 10px; background: #2b2f3b; color: var(--text); }
  .tia.troppi { background: #5a1f1f; color: #ffb3b3; }
  .spia { font-size: 12.5px; padding: 2px 10px; border-radius: 10px; font-weight: 600; cursor: default; }
  .spia.verde { background: #1f4a33; color: #b8f5d0; }
  .spia.rossa { background: #5a1f1f; color: #ffb3b3; }
  #aspettano { margin: 14px 20px 0; border: 2px solid #c62828; border-radius: 10px; background: #2a1618; padding: 10px 14px; }
  #aspettano[hidden] { display: none; }
  header h1, header label, .spia, .tia, .live { white-space: nowrap; }
  #ufficio3d { position: relative; margin: 16px 20px 0; border-radius: 8px; overflow: hidden; }
  #ufficio3d[hidden], #ufficio[hidden] { display: none; }
  #ufficio3d canvas { display: block; cursor: grab; }
  .etichette3d { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .et3d { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 12px/1.25 "Segoe UI", system-ui, sans-serif;
          pointer-events: auto; will-change: transform; }
  .et3d.nome { color: #2a3142; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff; font-size: 12.5px; }
  .et3d.nome.uff { font-size: 13.5px; }
  .et3d.riep { color: #2a3142; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff; white-space: pre; text-align: center; transform-origin: top; }
  .et3d.riep.chiama { color: #c62828; }
  .et3d.tg3d .pross { color: #5a6378; font-size: 10px; font-weight: 400; font-style: italic; white-space: normal; width: 96px; text-align: center; line-height: 1.15; margin: 1px auto 0; }
  .et3d.tg3d { color: #3a4256; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff; font-size: 11px; font-weight: 500; }
  /* fumetto-pensiero dei cartoni: nuvola tonda + pallini che scendono verso la testa */
  .et3d.f3d { background: #fff; color: #2a3142; border: 0; border-radius: 48% 52% 46% 54% / 60% 55% 62% 58%;
              box-shadow: 0 2px 8px rgba(40,60,90,.25); padding: 6px 12px; max-width: 128px; font-size: 11px;
              white-space: normal; text-align: center; margin-top: -26px; }
  .et3d.f3d::before, .et3d.f3d::after { content: ""; position: absolute; border-radius: 50%; background: inherit; box-shadow: inherit; }
  .et3d.f3d::before { width: 11px; height: 9px; left: calc(50% - 9px); bottom: -14px; }
  .et3d.f3d::after { width: 6px; height: 5px; left: calc(50% - 2px); bottom: -24px; }
  .et3d.f3d.st-aspetta { background: #ffe1e1; color: #a01818; box-shadow: 0 0 0 2px #f08a8a, 0 2px 8px rgba(160,24,24,.3); }
  .et3d.f3d.st-ferma { background: #fff1d6; }
  .et3d.f3d.st-finito { background: #e9ecf2; color: #555; }
  .et3d.f3d.st-pensa { background: #e4f1ff; }
  .et3d.f3d.st-allarme { background: #ff2b2b; color: #fff; border-color: #700; }
  #commesse { margin: 14px 20px 0; }
  #commesse[hidden] { display: none; }
  /* nel 3D le dashboard in alto stanno chiuse: si aprono (al loro solito posto) cliccando il proiettore */
  body.tre:not(.dash) #commesse { display: none; }
  body.tre #lista { display: none; }                                     /* in 3D le schede in basso non servono */
  #commesse .chiudi { display: none; float: right; background: var(--card); color: var(--text); border: 1px solid var(--line);
                      border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  body.tre.dash #commesse .chiudi { display: inline-block; }
  #commesse h2 { margin: 0 0 8px; font-size: 14px; letter-spacing: .06em; color: var(--muted); }
  #commesse-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .scheda { background: #23262f; border-radius: 10px; border-top: 5px solid var(--c); padding: 10px 14px 12px; font-size: 13px; }
  .scheda h3 { margin: 0; font-size: 16px; }
  .scheda .badge { display: inline-block; margin: 4px 0 6px; padding: 1px 10px; border-radius: 10px; background: var(--c);
                   color: #111; font-weight: 700; font-size: 11.5px; letter-spacing: .04em; }
  .scheda .prog { font-family: ui-monospace, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; margin-bottom: 4px; }
  .scheda b { display: block; color: var(--c); margin-top: 6px; }
  .scheda p, .scheda ol { margin: 1px 0 0; overflow-wrap: anywhere; }
  .scheda ol { padding-left: 18px; }
  .scheda a { display: block; margin-top: 10px; text-align: center; background: #eee; color: #111; border-radius: 6px;
              padding: 4px; font-weight: 700; text-decoration: none; }
  .scheda.fatto { opacity: .7; }
  #aspettano h2 { margin: 0 0 6px; font-size: 14px; letter-spacing: .06em; color: #ff8a8a; }
  .attesa-riga { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr) auto auto; gap: 12px; align-items: baseline;
                 padding: 5px 0; border-top: 1px solid #4a2a2c; font-size: 13.5px; }
  .attesa-riga:first-of-type { border-top: 0; }
  .attesa-riga .t { font-weight: 600; overflow-wrap: anywhere; }
  .attesa-riga .cosa { color: #ffd6d6; overflow-wrap: anywhere; }
  .attesa-riga .da { color: var(--muted); white-space: nowrap; font-size: 12px; }
  .attesa-riga a { color: #fff; background: #c62828; border-radius: 6px; padding: 2px 10px; text-decoration: none; font-weight: 600; white-space: nowrap; }
  @media (max-width: 700px) { .attesa-riga { grid-template-columns: 1fr auto; } .attesa-riga .cosa { grid-column: 1 / -1; } }
  .riepilogo { white-space: pre-line; position: absolute; text-align: center; z-index: 4; pointer-events: auto;
               font: 700 11.5px/1.2 "Segoe UI", system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #000; }
  .riepilogo.chiama { color: #ffb3b3; }
  .targa { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; color: #fff;
           font: 600 10.5px/1.2 "Segoe UI", system-ui, sans-serif; text-shadow: 0 1px 2px #000, 0 0 3px #000;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .ufficio-vuoto { position: absolute; left: 0; right: 0; bottom: 30%; text-align: center; color: #fff;
                   text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<header>
  <h1>Ufficio virtuale</h1>
  <span class="conta" id="conta"></span>
  <span class="tia" id="tia" title="Stima dalle sessioni delle ultime 2 ore: TIA aperti e non ancora chiusi. Regola: massimo 2 per versione e 3 in totale."></span>
  <span class="spia" id="spia"></span>
  <label title="Prova della versione 3D: trascina per girare, rotella per lo zoom"><input type="checkbox" id="vista3d"> 3D</label>
  <button id="demo3d" hidden title="Fa partire subito pausa caffè, bussate, postino con ordini e cantiere, per vederli senza aspettare">🎬 Prova animazioni</button>
  <button id="visuale3d" hidden title="Riporta la visuale 3D a quella iniziale (anche: doppio clic sull'ufficio)">🎯 Visuale iniziale</button>
  <label><input type="checkbox" id="soloAttive"> solo attive</label>
  <label title="Di base i link aprono l'app Claude per PC. Spunta se preferisci il browser."><input type="checkbox" id="linkBrowser"> link nel browser</label>
  <span class="live" id="live">non collegato</span>
  <span class="conta" id="versione" style="font-size:12px">server: versione vecchia</span>
  <button id="schermoIntero" title="Schermo intero (F11): ricliccalo, o premi Esc, per tornare alla finestra" style="font-size:18px;padding:2px 10px">⛶</button>
</header>
<section id="aspettano" hidden><h2>✋ TI ASPETTANO</h2><div id="aspettano-lista"></div></section>
<section id="commesse" hidden><button class="chiudi" id="chiudiDash">✕ Chiudi</button><h2>📋 COMMESSE</h2><div id="commesse-lista"></div></section>
<section id="ufficio"></section>
<section id="ufficio3d" hidden></section>
<main id="lista"><div class="vuoto">Carico le sessioni…</div></main>

<script src="/ufficio.js"></script>
<script src="/lib/three.min.js"></script>
<script src="/lib/OrbitControls.js"></script>
<script src="/ufficio3d.js"></script>
<script>
const STATI = {
  "aspetta": ["aspetta", "aspetta te"],
  "lavora": ["lavora", "lavora"],
  "pensa": ["pensa", "pensa"],
  "ferma?": ["ferma", "ferma da un po'"],
  "finito": ["finito", "ha finito"],
  "inattiva": ["inattiva", "inattiva"],
  "vuota": ["vuota", "vuota"],
};
let sessioni = [];
let extra = {};
const lista = document.getElementById("lista");
const soloAttive = document.getElementById("soloAttive");
soloAttive.checked = true;                           // di base solo le attive: le vecchie sono rumore
try { if (localStorage.getItem("soloAttive") === "0") soloAttive.checked = false; } catch (e) {}
const linkBrowser = document.getElementById("linkBrowser");
try { linkBrowser.checked = localStorage.getItem("linkBrowser") === "1"; } catch (e) {}
linkBrowser.onchange = () => {
  try { localStorage.setItem("linkBrowser", linkBrowser.checked ? "1" : "0"); } catch (e) {}
  render();
  disegnaUfficio();
};
soloAttive.onchange = () => {
  try { localStorage.setItem("soloAttive", soloAttive.checked ? "1" : "0"); } catch (e) {}
  render();
};

function fa(ts) {
  if (!ts) return "-";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return s + " s fa";
  if (s < 3600) return Math.floor(s / 60) + " min fa";
  return Math.floor(s / 3600) + " h " + Math.floor(s % 3600 / 60) + " min fa";
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function render() {
  const attive = ["aspetta", "lavora", "pensa", "ferma?"];
  // chi aspetta te viene sempre per primo
  sessioni = [...sessioni].sort((a, b) => (b.stato === "aspetta") - (a.stato === "aspetta"));
  const nAspetta = sessioni.filter(s => s.stato === "aspetta").length;
  // TIA aperti: processi veri del PC (dal server); se non disponibili, stima dalle sessioni
  const tiaEl = document.getElementById("tia");
  const perVer = {};
  let nTia;
  if (Array.isArray(extra.tia)) {
    nTia = extra.tia.length;
    for (const p of extra.tia) (perVer[p.versione] = perVer[p.versione] || []).push(p.di);
    tiaEl.textContent = "TIA aperti: " + nTia + "/3" + Object.entries(perVer).sort().map(([v, chi]) => {
      const conta = {};
      for (const c of chi) conta[c] = (conta[c] || 0) + 1;
      return " · " + v + ": " + chi.length + " (" + Object.entries(conta).map(([c, n]) => (n > 1 ? n + " " : "") + c).join(", ") + ")";
    }).join("");
    tiaEl.title = extra.tia.map(p => p.versione + " · " + (p.progetto || "senza progetto") + " · di " + p.di).join("\n") || "Nessun TIA Portal aperto";
  } else {
    const recenti = sessioni.filter(s => s.tia && Date.now() / 1000 - s.modificato < 7200);
    nTia = recenti.length;
    for (const s of recenti) (perVer[s.tia.versione || "?"] = perVer[s.tia.versione || "?"] || []).push(s);
    tiaEl.textContent = "TIA aperti (stima): " + nTia + "/3" +
      Object.entries(perVer).sort().map(([v, l]) => " · " + v + ": " + l.length).join("");
  }
  tiaEl.classList.toggle("troppi", nTia > 3 || Object.values(perVer).some(l => l.length > 2));
  document.querySelector("#aspettano h2").textContent = "✋ TI ASPETTANO" + (extra.cloud_aggiornato ?
    "  ·  ☁️ thread cloud aggiornati alle " + new Date(extra.cloud_aggiornato * 1000).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) : "");
  aspettano();
  commesse();
  spia();
  document.title = (nAspetta ? `(${nAspetta}) ✋ ` : "") + "Ufficio virtuale";
  const vis = soloAttive.checked ? sessioni.filter(s => attive.includes(s.stato)) : sessioni;
  const nAttive = sessioni.filter(s => attive.includes(s.stato)).length;
  document.getElementById("conta").textContent =
    `${sessioni.length} sessioni, ${nAttive} al lavoro` + (nAspetta ? ` · ✋ ${nAspetta} ti aspett${nAspetta > 1 ? "ano" : "a"}` : "");
  lista.replaceChildren();
  if (!vis.length) {
    lista.append(el("div", "vuoto", soloAttive.checked ? "Nessun agente al lavoro adesso." : "Nessuna sessione recente."));
    return;
  }
  for (const s of vis) {
    const [cls, etichetta] = STATI[s.stato] || ["sconosciuto", s.stato];
    const card = el("article", "card " + cls);
    card.title = "Apri la chat completa";
    card.onclick = () => s.link ? apriLink(s.link)
      : window.open("/chat?id=" + encodeURIComponent(s.id), "chat-" + s.id);
    const top = el("div", "top");
    top.append(el("span", "stato", etichetta));
    const q = el("span", "quando", fa(s.modificato));
    q.dataset.ts = s.modificato;
    top.append(q);
    card.append(top, el("div", "titolo", (s.cloud ? "☁️ " : "") + (s.titolo || "(senza titolo)")));
    if (s.sottotitolo) card.append(el("div", "sottotitolo", s.sottotitolo));
    if (s.responsabile) top.insertBefore(el("span", "resp", "👤 " + s.responsabile), q);
    const lavoro = el("div", "lavoro");
    if (s.commessa) lavoro.append(el("span", "commessa", "📌 " + s.commessa));
    if (s.progetto_tia) lavoro.append(el("span", "", "🧩 " + s.progetto_tia + (s.tia && s.tia.versione ? " · " + s.tia.versione : "")));
    if (s.compilazione) lavoro.append(el("span", s.compilazione.errori == null ? "grigio" : "",
      s.compilazione.errori === 0 ? "✅ compila" : s.compilazione.errori == null ? "esito compilazione ?"
      : "❌ " + (s.compilazione.errori > 0 ? s.compilazione.errori + " errori" : "errori")));
    if (s.plcsim) lavoro.append(el("span", "", "🧪 PLCSIM attivo"));
    if (s.download) lavoro.append(el("span", "commessa", "🚨 download sul PLC!"));
    if (s.progetto_claude) lavoro.append(el("span", "", "🗂️ " + s.progetto_claude));
    if (s.link) {
      const a = el("a", "link", "apri su claude.ai ↗");
      collegaLink(a, s.link);
      a.title = "Apre la chat nel progetto claude.ai";
      a.onclick = ev => ev.stopPropagation();
      lavoro.append(a);
    }
    if (lavoro.childNodes.length) card.append(lavoro);
    if (s.attivita) {
      const a = el("div", "attivita");
      a.append(el("span", "icona", s.icona || ""), el("span", "", s.attivita));
      card.append(a);
    }
    if (s.dettaglio) card.append(el("div", "dettaglio", s.dettaglio));
    if (s.sotto_agenti || s.cloud) {
      const meta = el("div", "meta");
      if (s.cloud) meta.append(el("span", "", "☁️ nel cloud"));
      if (s.sotto_agenti) meta.append(el("span", "", "👥 " + s.sotto_agenti + " sotto-agenti"));
      card.append(meta);
    }
    lista.append(card);
  }
}

// striscia in cima: chi ti aspetta, per cosa, da quanto, e dove cliccare
function aspettano() {
  const chi = sessioni.filter(s => s.stato === "aspetta").sort((a, b) => a.modificato - b.modificato);
  const box = document.getElementById("aspettano"), lista = document.getElementById("aspettano-lista");
  box.hidden = !chi.length;
  lista.replaceChildren();
  for (const s of chi) {
    const riga = el("div", "attesa-riga");
    riga.append(el("span", "t", (s.cloud ? "☁️ " : "") + (s.titolo || s.responsabile || "(senza titolo)")),
                el("span", "cosa", s.attivita || "ti aspetta"));
    const q = el("span", "da quando", fa(s.modificato));
    q.dataset.ts = s.modificato;
    riga.append(q);
    const a = el("a", "", "Rispondi ↗");
    if (s.link) collegaLink(a, s.link);
    else { a.href = "/chat?id=" + encodeURIComponent(s.id); a.target = "_blank"; }
    a.title = s.link ? "Apre il thread su claude.ai" : "Apre la chat della sessione";
    riga.append(a);
    lista.append(riga);
  }
}

// schede delle commesse, come la dashboard "Commesse PLC" di Agente TIA
const NOMI_STATO = { "in lavorazione": "IN LAVORAZIONE", "domande aperte": "DOMANDE APERTE", "aspetta stefano": "ASPETTA STEFANO", "fatto": "FATTO" };
function commesse() {
  const lista = extra.commesse || [];
  const box = document.getElementById("commesse"), dove = document.getElementById("commesse-lista");
  box.hidden = !lista.length;
  if (extra.commesse_aggiornate) box.querySelector("h2").textContent = "📋 COMMESSE  ·  aggiornate alle " +
    new Date(extra.commesse_aggiornate * 1000).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  dove.replaceChildren();
  for (const c of lista) {
    const k = el("article", "scheda" + (c.stato === "fatto" ? " fatto" : ""));
    k.style.setProperty("--c", c.colore);
    k.append(el("h3", "", c.nome), el("span", "badge", NOMI_STATO[c.stato] || c.stato.toUpperCase()));
    if (c.progetto_tia) k.append(el("div", "prog", c.progetto_tia));
    const parte = (t, v) => { if (v) k.append(el("b", "", t), el("p", "", v)); };
    if (c.testo) parte("", c.testo);
    parte("Fatto", c.fatto);
    if (c.in_corso && c.in_corso !== "Niente.") parte("In corso", c.in_corso);
    if (c.domande.length) {
      k.append(el("b", "", "Domande aperte"));
      const ol = el("ol");
      for (const d of c.domande) ol.append(el("li", "", d));
      k.append(ol);
    }
    parte("Aspetta", c.aspetta);
    if (c.link) {
      const a = el("a", "", "APRI");
      collegaLink(a, c.link);
      k.append(a);
    }
    dove.append(k);
  }
}

// spia "posso spegnere il PC?": verde se nessun agente sta usando il PC
function spia() {
  const e = document.getElementById("spia");
  const usano = [];
  for (const s of sessioni)
    if (!s.cloud && ["lavora", "pensa", "ferma?"].includes(s.stato)) usano.push((s.titolo || s.progetto || "sessione") + " (" + s.stato + ")");
  if (Array.isArray(extra.tia))
    for (const p of extra.tia) if (p.di !== "Stefano") usano.push("TIA " + p.versione + (p.progetto ? " " + p.progetto : "") + " di " + p.di);
  e.className = "spia " + (usano.length ? "rossa" : "verde");
  e.textContent = usano.length ? "🔴 PC in uso (" + usano.length + ")" : "🟢 puoi spegnere il PC";
  e.title = usano.length ? "Stanno usando il PC:\n" + usano.join("\n") : "Nessun agente al lavoro sul PC e nessun TIA aperto da un agente";
}

// aggiorna i "x min fa" senza ridisegnare tutto
setInterval(() => {
  for (const q of document.querySelectorAll(".quando")) q.textContent = fa(+q.dataset.ts);
}, 1000);

// vista 2D (pixel art) o 3D (prova): la scelta resta per la prossima volta
const vista3d = document.getElementById("vista3d");
try { vista3d.checked = localStorage.getItem("vista3d") === "1"; } catch (e) {}
function disegnaUfficio() {
  const tre = vista3d.checked && !!window.Ufficio3D;
  document.getElementById("ufficio").hidden = tre;
  document.getElementById("ufficio3d").hidden = !tre;
  if (window.Ufficio3D) Ufficio3D.attiva(tre);
  document.getElementById("demo3d").hidden = !tre;
  document.getElementById("visuale3d").hidden = !tre;
  document.body.classList.toggle("tre", tre);
  const dash = document.getElementById("commesse");                      // in 3D la dashboard sta sotto l'ufficio, al posto delle schede
  if (tre) document.getElementById("ufficio3d").after(dash); else document.getElementById("ufficio").before(dash);
  if (tre) Ufficio3D.disegna(sessioni, extra);
  else if (window.Ufficio) Ufficio.disegna(sessioni, extra);
}
// dashboard sopra la pagina, aperta dal proiettore del 3D
window.apriDashboard = si => {
  document.body.classList.toggle("dash", si !== false);
  if (si !== false) {
    const d = document.getElementById("commesse");
    setTimeout(() => d.scrollIntoView({ behavior: "smooth", block: document.body.classList.contains("tre") ? "nearest" : "start" }), 50);
  }
};
document.getElementById("chiudiDash").onclick = () => apriDashboard(false);
// schermo intero: il pulsante cambia icona e lo stesso pulsante riporta alla finestra
// una sola finestra dell'ufficio: quando se ne apre un'altra, la vecchia si chiude (resta la nuova)
try {
  const canale = new BroadcastChannel("ufficio-virtuale"), mio = Date.now() + Math.random();
  canale.onmessage = e => { if (e.data && e.data.nuova && e.data.id !== mio) { canale.close(); window.close(); } };
  canale.postMessage({ nuova: true, id: mio });
} catch (e) { /* browser vecchio: pazienza */ }
const btnIntero = document.getElementById("schermoIntero");
btnIntero.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
document.addEventListener("fullscreenchange", () => {
  const si = !!document.fullscreenElement;
  btnIntero.textContent = si ? "🗗" : "⛶";
  btnIntero.title = si ? "Torna alla finestra (Esc)" : "Schermo intero (F11): ricliccalo, o premi Esc, per tornare alla finestra";
});
document.getElementById("visuale3d").onclick = () => { if (window.Ufficio3D) Ufficio3D.inquadra(); };
document.getElementById("demo3d").onclick = () => {
  if (!window.Ufficio3D) return;
  Ufficio3D.provaCantiere(1); Ufficio3D.provaChiusura(0); Ufficio3D.caffeSubito(); Ufficio3D.provaPostino(0);
  Ufficio3D.provaDivertenti();
};
vista3d.onchange = () => {
  try { localStorage.setItem("vista3d", vista3d.checked ? "1" : "0"); } catch (e) {}
  disegnaUfficio();
};

function collega() {
  const live = document.getElementById("live");
  const es = new EventSource("/api/stream");
  es.addEventListener("ufficio", ev => { extra = JSON.parse(ev.data); });
  es.addEventListener("sessioni", ev => {
    sessioni = JSON.parse(ev.data);
    render();
    disegnaUfficio();
  });
  es.onopen = () => { live.textContent = "live"; live.classList.add("on"); };
  es.onerror = () => { live.textContent = "server non raggiungibile, riprovo…"; live.classList.remove("on"); };
}
collega();
fetch("/api/versione").then(r => r.ok ? r.json() : null).then(v => {
  if (v) document.getElementById("versione").textContent = "versione: " + v.versione + (v.git ? " · " + v.git : "");
}).catch(() => {});
// se il server si aggiorna, ricarico la pagina con la versione nuova
let versioneIniziale = null;
async function controllaVersione() {
  try {
    const v = await (await fetch("/api/versione", { cache: "no-store" })).json();
    const id = v.versione + "/" + (v.git || "");
    if (versioneIniziale === null) versioneIniziale = id;
    else if (id !== versioneIniziale) location.reload();
  } catch (e) {}
}
controllaVersione();
setInterval(controllaVersione, 20000);
</script>
